name: LegacyPadDisplay
options:
  createIntermediateGroups: true
  bundleIdPrefix: com.example.legacypaddisplay

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LegacyPadDisplay:
    type: application
    platform: iOS
    # 真机是 iPad mini 4 / iOS 14.8。hev-socks5-server 的 XCFramework 按
    # minos 14.8 构建，deployment target 必须 ≥ 14.8 才能零告警链接。
    deploymentTarget: "14.8"
    sources:
      - App
    dependencies:
      # hev-socks5-server —— 本项目唯一的 SOCKS5 引擎（协程版）。
      # 静态库（.a 打包成 xcframework），不需要 embed。
      # 构建方式见 ../iPad端SOCKS引擎升级为hev_实现规格.md 附录 C：
      #   minos 14.8 / sdk 26.0，只含 iphoneos + iphonesimulator 两片。
      - framework: Vendor/HevSocks5Server.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LegacyPadDisplay
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: LaunchScreen
        # 静音音频保活（AudioKeepAlive.swift）：锁屏后进程不挂起，SOCKS 9001 持续可连。
        UIBackgroundModes:
          - audio
        # 副屏期间 Wi-Fi 不能睡：iPad 是 Wi-Fi-only，SOCKS 借道全靠它。
        UIRequiresPersistentWiFi: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "LegacyPadDisplay listens on the local network / USB so your Mac can send it a video stream."
        NSBonjourServices:
          - "_opensidecar._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.legacypaddisplay
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "14.8"
        # hev 是带 modulemap 的 xcframework，Swift 侧直接 `import HevSocks5Server`
        # 即可，不再需要 Objective-C bridging header。
